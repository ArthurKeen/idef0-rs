# Pull-request pipeline (docs/architecture.md §15.1): base jobs (roadmap M0.3), cross-OS and MSRV
# jobs (M0.4). wasm-bindgen-test, trunk, e2e, bench-gate and dogfood arrive with the epics that
# create what they test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint (fmt, clippy native + wasm32, determinism, deps, deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (native)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: clippy (wasm32; core, mangle, layout, wasm)
        run: >
          cargo clippy --locked --target wasm32-unknown-unknown
          -p idef0-core -p idef0-mangle -p idef0-layout -p idef0-wasm -- -D warnings
      - name: Determinism lint probe (NFR-DET-02..04)
        run: scripts/check-determinism-lints.sh
      - name: Dependency graph audit (architecture §2.2, §3.2)
        run: scripts/check-dependency-graph.sh
      - name: cargo deny (licenses, bans, advisories, sources)
        run: cargo deny --locked check

  test-linux:
    name: test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROPTEST_RNG_SEED: "1"   # fixed per job (docs/testing.md §2)
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked --workspace

  # The native crates are every crate except idef0-wasm, which ships only as wasm32.
  test-macos:
    name: test (macos)
    runs-on: macos-14
    timeout-minutes: 25
    env:
      PROPTEST_RNG_SEED: "2"   # fixed per job (docs/testing.md §2)
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (native crates)
        run: cargo test --locked --workspace --exclude idef0-wasm

  test-windows:
    name: test (windows, MSVC)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PROPTEST_RNG_SEED: "3"   # fixed per job (docs/testing.md §2)
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version --verbose | grep -E '^(rustc|host)'
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (native crates)
        run: cargo test --locked --workspace --exclude idef0-wasm

  msrv:
    name: msrv (rust-version in Cargo.toml)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the MSRV toolchain (`rust-version` in [workspace.package])
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
          rustc "+$msrv" --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # `+$MSRV` overrides rust-toolchain.toml for this command only.
      - name: cargo check on the MSRV (native crates)
        run: cargo "+$MSRV" check --locked --workspace --all-targets --exclude idef0-wasm

  wasm:
    name: wasm32 build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - name: cargo build (wasm32-unknown-unknown)
        run: >
          cargo build --locked --target wasm32-unknown-unknown
          -p idef0-core -p idef0-mangle -p idef0-layout -p idef0-wasm

  docs:
    name: docs links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Relative links and anchors
        run: python3 scripts/check-doc-links.py
