# Target-scoped so native builds keep their cache when wasm is built (docs/architecture.md §13.1).
# A RUSTFLAGS or CARGO_ENCODED_RUSTFLAGS env var replaces this table; idef0-wasm refuses to build without the cfg.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis"]   # File System Access API bindings in web-sys
