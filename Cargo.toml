[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/ArthurKeen/idef0-rs"
publish      = false

# Versions follow docs/architecture.md §12.1. All requirements were checked against
# crates.io on 2026-10-16 (M0.2). Crates declare only what they use;
# `Cargo.lock` pins exact versions.
[workspace.dependencies]
# internal
idef0-core   = { path = "crates/idef0-core" }
idef0-mangle = { path = "crates/idef0-mangle" }
idef0-layout = { path = "crates/idef0-layout" }
idef0-ingest = { path = "crates/idef0-ingest" }
idef0-server = { path = "crates/idef0-server" }

# data and text (wasm-safe)
serde                = { version = "1.0.228", features = ["derive", "rc"] }
serde_json           = "1.0.145"
winnow               = "1.0"
smallvec             = { version = "1.15", features = ["serde", "union"] }
compact_str          = { version = "0.9", features = ["serde"] }      # 0.10 exists; raise in its own PR
nonempty             = { version = "0.12", features = ["serialize"] }
indexmap             = { version = "2.13", features = ["serde"] }
unicode-segmentation = "1.12"
unicode-width        = "0.2"
thiserror            = "2.0"

# search (wasm-safe)
levenshtein_automata = "0.2.1"
rust-stemmers        = "1.2"
libm                 = "0.2"                                           # identical float math on native and wasm32
rstar                = "0.13"
blake3               = { version = "1.8", default-features = false, features = ["pure"] }  # `pure`: no C/asm, wasm-safe

# markdown
pulldown-cmark       = { version = "0.13", default-features = false }
ammonia              = "4.1"                                           # native exports only

# wasm UI (idef0-wasm only)
leptos               = { version = "0.8.21", features = ["csr"] }
wasm-bindgen         = "0.2.126"                                       # must equal wasm-bindgen-cli in CI
web-sys              = "0.3.103"
js-sys               = "0.3.103"
gloo-worker          = "0.6"                                           # Leptos 0.8 compatibility: verify at M7.1
web-time             = "1.1"
getrandom            = { version = "0.4", features = ["wasm_js"] }    # idef0-wasm only, and only if needed

# server and native
tokio                = { version = "1.51", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync"] }
axum                 = { version = "0.8.6", features = ["ws"] }
tower                = "0.5"
tower-http           = { version = "0.6", features = ["trace", "compression-gzip", "cors", "fs", "limit", "set-header"] }  # 0.7 has breaking changes; evaluate separately
rust-embed           = "8.9"
notify               = "8.2"
notify-debouncer-full = "0.6"
ignore               = "0.4.31"
globset              = "0.4"
rayon                = "1.11"                                          # idef0-ingest only (D6)
memchr               = "2.8"
regex                = "1.12"
tantivy              = "0.26"
tree-sitter          = "0.27"                                          # needs rustc 1.90 (sets the MSRV)
tree-sitter-rust       = "0.24"                                        # grammar ABI compatibility: verify at M10.1
tree-sitter-python     = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go         = "0.25"
tree-sitter-java       = "0.23"
resvg                = "0.48"
tiny-skia            = "0.12"
fontdb               = "0.24"                                          # must match usvg's fontdb requirement
clap                 = { version = "4.5", features = ["derive", "env"] }
serde-sarif          = "0.8"
tracing              = "0.1.41"
tracing-subscriber   = { version = "0.3.20", features = ["env-filter", "json"] }
reqwest              = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }  # server/cli only (Anthropic client)
camino               = "1"

# test and bench (dev-dependencies)
insta                = { version = "1.47", features = ["json", "glob", "redactions"] }
proptest             = "1.9"
criterion            = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gungraun             = "0.20"                                          # successor of iai-callgrind; runner install at M0.3
wasm-bindgen-test    = "0.3.76"
chromiumoxide        = { version = "0.9", default-features = false }  # 0.9 is tokio-only; there is no runtime feature
axum-test            = "21"
arbitrary            = { version = "1.4", features = ["derive"] }
libfuzzer-sys        = "0.4"
jsonschema           = { version = "0.58", default-features = false }  # pick draft/resolver features at M3.4

[workspace.lints.rust]
unsafe_code                   = "forbid"   # no exceptions (architecture §14); verified with leptos::view! and #[wasm_bindgen_test]
missing_debug_implementations = "warn"
unreachable_pub               = "warn"

[workspace.lints.clippy]
all       = { level = "deny", priority = -1 }
pedantic  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
dbg_macro   = "deny"
todo        = "warn"
unwrap_used = "warn"   # denied in core/mangle/layout by crate attribute
