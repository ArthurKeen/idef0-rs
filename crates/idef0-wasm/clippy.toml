# idef0-wasm. Clippy reads only the nearest clippy.toml, so this file repeats the root settings
# (docs/architecture.md §2.3). std::time::{Instant, SystemTime} panic on wasm32-unknown-unknown;
# use web-time (§2.2).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
disallowed-types = [
  { path = "std::time::Instant",    reason = "panics on wasm32; use web_time::Instant" },
  { path = "std::time::SystemTime", reason = "panics on wasm32; use web_time::SystemTime" },
]
